services:
  # The existing Python launcher keeps the five FastAPI processes together in
  # one Render web service. The API gateway is the public port; the other
  # fixed ports remain private to this same instance and continue to use the
  # existing localhost service URLs.
  - type: web
    name: aero-digital-twin-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python services/run_all_services.py
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: TELEMETRY_INPUT_MODE
        value: csv
      - key: MONGO_DB_NAME
        value: aero_digital_twin_db
      - key: MONGO_URL
        sync: false
      - key: INTERNAL_SERVICE_KEY
        generateValue: true

  # React 3D GCS Dashboard. The WebSocket URL is derived from the gateway
  # URL during the static-site build so it is not tied to localhost.
  - type: web
    name: aero-digital-twin-frontend
    runtime: static
    buildCommand: >-
      cd frontend && npm ci &&
      VITE_WS_URL="$(printf '%s' "$VITE_API_BASE_URL" |
      sed -e 's#^https:#wss:#' -e 's#^http:#ws:#')/ws/telemetry"
      npm run build
    staticPublishPath: frontend/dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: aero-digital-twin-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

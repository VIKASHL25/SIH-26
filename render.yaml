services:
  # 1. Unified Microservices Backend (FastAPI Services)
  - type: web
    name: aero-digital-twin-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python services/run_all_services.py
    autoDeploy: true
    envVars:
      - key: TELEMETRY_INPUT_MODE
        value: csv
      - key: MONGO_DB_NAME
        value: aero_digital_twin_db
      - key: MONGO_URL
        sync: false
      - key: INTERNAL_SERVICE_KEY
        sync: false

  # 2. React 3D GCS Dashboard Frontend
  - type: web
    name: aero-digital-twin-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: aero-digital-twin-backend
          property: url
